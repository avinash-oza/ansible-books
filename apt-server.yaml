---
# noqa: yaml[indentation]
- name: Allow main-server to take rsnapshot backups of the APT server
  hosts: main-server
  remote_user: deploy
  gather_facts: false
  become: true

  tasks:
    - name: Slurp the remote public SSH key
      ansible.builtin.slurp:
        src: /root/.ssh/id_rsa.pub
      register: slurped_ssh_key


