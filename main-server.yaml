---
# noqa: yaml[empty-lines]
- name: Allow apt-server to take rsnapshot backups of the main server
  hosts: apt-server
  remote_user: deploy
  gather_facts: false
  become: true

  tasks:
    - name: Slurp the remote public SSH key
      ansible.builtin.slurp:
        src: /root/.ssh/id_rsa.pub
      register: slurped_ssh_key

- name: Configure Main Server
  hosts: main-server
  remote_user: deploy
  become: true

  roles:
#   - { role: setup_main_server }
#   - { role: add_and_setup_user }
#   - { role: base_setup }
    # - { role: install_and_configure_ssmtp, tags: ['ssmtp'] }
    # - { role: setup_health_check }
#   - { role: install_and_configure_letsencrypt }
#   - { role: setup_apcupsd, tags: ['apcupsd'] }
    - { role: setup_internal_dns, become: true }
#   - { role: setup_chrony_client , become: true}
    - role: install_rsnapshot 
      ssh_pub_keys: ["{{ hostvars['apt-server-1'].slurped_ssh_key.content | b64decode }}"] 
