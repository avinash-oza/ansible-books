---

- name: deploy mariadb container
  community.docker.docker_container:
    name: some-mariadb-container
    image: "mariadb:11.8.5"
    state: started
    restart_policy: always
    volumes:
      - "{{ docker_data_path }}/mysql:/var/lib/mysql"
    networks:
      - name: db_network
    env:
      MYSQL_ROOT_PASSWORD: "{{ vault_mysql_root_password }}"
      MARIADB_AUTO_UPGRADE: "TRUE"

- name: deploy phpmyadmin container
  community.docker.docker_container:
    name: some-phpmyadmin-container
    image: "phpmyadmin/phpmyadmin:5.2.3"
    state: started
    restart_policy: always
    networks:
      - name: db_network
      - name: proxy_network
    labels:
      caddy: "phpmyadmin.{{ vault_internal_domain_name }}"
      caddy.reverse_proxy: "{{ '{{' }}upstreams 80{{ '}}' }}"
    env:
      PMA_HOST: some-mariadb-container

- name: copy over backup notification scripts
  ansible.builtin.include_role:
    name: copy_scripts
    apply:
      become: true
  vars:
    script_to_copy: "{{ item }}"
    file_permissions: '0755'
  loop:
    - send-healthchecks-io.sh
    - db-backup-start.sh
    - db-backup-finish.sh

 
- name: deploy backup container
  community.docker.docker_container:
    name: some-mariadb-backup-container
    image: "ghcr.io/nfrastack/container-db-backup:4.9.0"
    state: started
    restart_policy: always
    networks:
      - name: db_network
    volumes:
      - "{{ scripts_dir }}/db-backup-start.sh:/assets/scripts/pre/db-backup-start.sh"
      - "{{ scripts_dir }}/db-backup-finish.sh:/assets/scripts/post/db-backup-finish.sh"
      - "{{ scripts_dir }}/send-healthchecks-io.sh:/assets/scripts/send-healthchecks-io.sh"
    env:
      CONTAINER_ENABLE_MONITORING: "FALSE"
      DEFAULT_BACKUP_LOCATION: "S3"
      # wait 10 mins before starting initial backup
      DEFAULT_BACKUP_BEGIN: "+10"
      DEFAULT_S3_BUCKET: "{{ vault_aws_projects_bucket }}"
      DEFAULT_S3_REGION: "{{ vault_aws_default_region }}"
      DEFAULT_S3_PATH: "backups/db/mariadb"
      DEFAULT_S3_KEY_ID: "{{ vault_aws_keys['db-backup']['key_id'] }}"
      DEFAULT_S3_KEY_SECRET: "{{ vault_aws_keys['db-backup']['access_key'] }}"
      # pre/post scripts are setup independently
      # 7 days
      DEFAULT_BACKUP_INTERVAL: "10080"
      DB01_TYPE: "mysql"
      DB01_HOST: "some-mariadb-container"
      DB01_NAME: "{{ docker_db_backup_mysql_dbs }}"
      DB01_SPLIT_DB: "TRUE"
      DB01_USER: root
      DB01_PASS: "{{ vault_mysql_root_password }}"
      # 20 days
      DB01_CLEANUP_TIME: "28800"
