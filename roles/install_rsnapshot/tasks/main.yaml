---
# noqa: risky-file-permissions
- name: Install rsnapshot
  ansible.builtin.apt:
    name: rsnapshot
    state: present

- name: Create user for pull backups
  ansible.builtin.user:
    name: rsnapshotuser
    shell: "/bin/bash"
    state: present

- name: Allow rsync access for backups
  ansible.builtin.blockinfile:
    path: /etc/sudoers
    marker: "# {mark} rsnapshotuser sudo"
    block: "rsnapshotuser ALL=(root) NOPASSWD:/usr/bin/rsync"
    validate: 'visudo -cf %s'

# this is to allow other machines to take backups of this machine
- name: Add authorized SSH keys for rsnapshotuser
  ansible.posix.authorized_key:
    user: rsnapshotuser
    state: present
    key: "{{ item }}"
  loop: "{{ ssh_pub_keys }}"

- name: copy over healthchecks.io notification scripts
  ansible.builtin.include_role:
    name: copy_scripts
    apply:
      become: true
  vars:
    script_to_copy: "{{ item }}"
    file_permissions: '0755'
  loop:
    - send-healthchecks-io.sh

- name: Copy config file
  ansible.builtin.template:
    backup: true
    src: "rsnapshot-{{ group_names[0] }}.conf.j2"
    dest: /etc/rsnapshot.conf
    owner: root
    group: root
    validate: "echo %s; rsnapshot configtest"

- name: Copy cron config file
  ansible.builtin.template:
    backup: true
    src: rsnapshot.j2
    dest: /etc/cron.d/rsnapshot
    owner: root
    group: root
