# noqa: var-naming[no-role-prefix]
user_name: deploy
user_password: "{{ vault_deploy_password }}"
user_shell: /bin/bash
allow_sudo: true
dotfiles_repo: https://github.com/avinash-oza/dotfiles.git
user_home_directory: /home/{{ user_name }}
vundle_repo: https://github.com/VundleVim/Vundle.vim.git
add_public_keys:
  - win-desktop-new.pub
  - apt-desktop.pub
remove_public_keys:
  - ansible_tower.pub
  - id_rsa.pub
  - laptop.pub
  - win-desktop.pub
