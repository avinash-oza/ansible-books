---
# noqa: risky-file-permissions yaml[indentation]

- name: Install ssmtp
  become: true
  ansible.builtin.apt:
      name: "{{ item }}"
      state: present
  with_items:
    - ssmtp
    - mailutils

- name: Copy ssmtp config files
  become: true
  ansible.builtin.template:
      src: "{{ item }}.j2"
      dest: "/etc/ssmtp/{{ item }}"
      owner: root
      group: root
  with_items:
      - revaliases
      - ssmtp.conf

- name: copy over healthchecks.io notification scripts
  ansible.builtin.include_role:
    name: copy_scripts
    apply:
      become: true
  vars:
    script_to_copy: "{{ item }}"
    file_permissions: '0755'
  loop:
    - send-healthchecks-io.sh

- name: Add cron weekly email
  ansible.builtin.cron:
      name: "Weekly email"
      job: '{{ scripts_dir }}/send-healthchecks-io.sh finish {{ inventory_hostname }}-uptime'
      special_time: weekly
      state: present
