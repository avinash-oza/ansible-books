---
# noqa: risky-file-permissions yaml[indentation]

- name: Install ssmtp
  become: true
  ansible.builtin.apt:
      name: "{{ item }}"
      state: present
  with_items:
    - ssmtp
    - mailutils

- name: Copy ssmtp config files
  become: true
  ansible.builtin.template:
      src: "{{ item }}.j2"
      dest: "/etc/ssmtp/{{ item }}"
      owner: root
      group: root
  with_items:
      - revaliases
      - ssmtp.conf
