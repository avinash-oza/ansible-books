---
# noqa: yaml[empty-lines]

- name: setup apt sources for ubuntu
  ansible.builtin.include_tasks: ubuntu.yaml
  when: ansible_distribution == "Ubuntu"

- name: setup apt sources for debian
  ansible.builtin.include_tasks: debian.yaml
  when: ansible_distribution == "Debian"

- name: setup proxmox no-subscription repository
  ansible.builtin.include_tasks: setup_proxmox_no_subscription.yaml
  when:
    - is_proxmox | default(false) | bool
    - ansible_distribution == "Debian"
